{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}-dashboard
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  frontend.json: |-
{{ .Files.Get "dashboards/frontend.json" | indent 4 }}
{{- end }}
