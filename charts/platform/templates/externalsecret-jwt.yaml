{{- $es := .Values.externalSecrets }}
{{- if $es.jwt.enabled }}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $es.jwt.secretName }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ $es.jwt.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $es.jwt.targetKey }}
      remoteRef:
        key: {{ $es.jwt.remoteKey }}
{{- end }}
