{{- if .Values.karpenter.enabled }}
{{- range $name, $np := .Values.karpenter.nodePools }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.labels" $ | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        {{- toYaml $np.labels | nindent 8 }}
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: {{ $.Values.karpenter.nodeClassName }}
      requirements:
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: {{ toJson $np.categories }}
        - key: karpenter.sh/capacity-type
          operator: In
          values: {{ toJson $np.capacityTypes }}
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      {{- with $np.taints }}
      taints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  limits:
    cpu: {{ $np.limits.cpu | quote }}
    memory: {{ $np.limits.memory | quote }}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: {{ default "1m" $np.consolidateAfter }}
{{- end }}
{{- end }}
