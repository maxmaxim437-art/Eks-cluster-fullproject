{{- if or .Values.externalSecrets.db.enabled .Values.externalSecrets.jwt.enabled }}
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ClusterSecretStore
metadata:
  name: {{ .Values.externalSecrets.storeName }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
      # No "auth" block on purpose: the operator uses its own IRSA role.
{{- end }}
