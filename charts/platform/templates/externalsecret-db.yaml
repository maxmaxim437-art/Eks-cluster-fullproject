{{- $es := .Values.externalSecrets }}
{{- if $es.db.enabled }}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $es.db.secretName }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ $es.db.secretName }}
    creationPolicy: Owner
  data:
    {{- range $es.db.keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $es.db.remoteKey }}
        property: {{ . }}
    {{- end }}
{{- end }}
