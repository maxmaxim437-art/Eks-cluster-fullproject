{{- if .Values.karpenter.enabled }}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: {{ .Values.karpenter.nodeClassName }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  role: {{ .Values.karpenter.nodeRole | quote }}
  amiSelectorTerms:
    - alias: {{ .Values.karpenter.amiAlias | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ default .Values.clusterName .Values.karpenter.discoveryTag | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ default .Values.clusterName .Values.karpenter.discoveryTag | quote }}
{{- end }}
