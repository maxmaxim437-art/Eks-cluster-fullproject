replicaCount: 2

image:
  repository: <your-registry>/backend
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

# Non-sensitive settings -> ConfigMap
config:
  PORT: "3000"
  # Number of proxies in front of the backend: ALB -> nginx -> backend = 2.
  # If the backend is exposed directly through its own ALB Ingress, use "1".
  TRUST_PROXY: "2"
  DB_NAME: archdb

# Sensitive settings -> existing Kubernetes Secrets (never stored in Git)
secrets:
  db:
    name: db-credentials        # created by ExternalSecrets (Section 9)
    keys:
      username: username
      password: password
      host: host
      port: port
  jwt:
    name: jwt-secret
    key: JWT_SECRET

# Disabled by default: the frontend's nginx proxies /api to the backend.
ingress:
  enabled: false
  className: alb
  host: api.example.com
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    # Section 8:
    # external-dns.alpha.kubernetes.io/hostname: api.example.com

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 256Mi }

# Health endpoints exist in server.js: /healthz (alive) and /readyz (DB ready)
readinessProbe:
  httpGet: { path: /readyz, port: http }
  initialDelaySeconds: 5
  periodSeconds: 10
livenessProbe:
  httpGet: { path: /healthz, port: http }
  initialDelaySeconds: 15
  periodSeconds: 20

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: role
              operator: In
              values: ["app"]
tolerations: []

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleUpStabilizationSeconds: 60
  scaleDownStabilizationSeconds: 300

# server.js has no /metrics yet (Section 5: add prom-client, then enable)
metrics:
  enabled: true
  path: /metrics
  interval: 30s

# Vertical Pod Autoscaler - recommendations only (Section 6.3)
vpa:
  enabled: true
  updateMode: "Off"

# Grafana dashboard, loaded automatically from a ConfigMap (Section 5.3)
dashboard:
  enabled: true
