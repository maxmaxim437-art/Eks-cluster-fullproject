{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "database.backupName" . }}
  labels:
    {{- include "database.labels" . | nindent 4 }}
  annotations:
    backup/retention-days: {{ .Values.backup.retentionDays | quote }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "database.labels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "database.backupName" . }}
          volumes:
            - name: backup
              emptyDir: {}
          # 1) dump + compress into the shared emptyDir
          initContainers:
            - name: dump
              image: {{ .Values.backup.dumpImage | quote }}
              env:
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.secretName }}
                      key: {{ .Values.backup.secretKeys.host }}
                - name: PGPORT
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.secretName }}
                      key: {{ .Values.backup.secretKeys.port }}
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.secretName }}
                      key: {{ .Values.backup.secretKeys.username }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.secretName }}
                      key: {{ .Values.backup.secretKeys.password }}
                - name: PGDATABASE
                  value: {{ .Values.backup.dbName | quote }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  FILE="db-`date +%Y%m%d-%H%M%S`.sql"
                  pg_dump --no-owner --no-privileges -f "/backup/$FILE"
                  gzip "/backup/$FILE"
                  echo "$FILE.gz" > /backup/filename
                  ls -lh /backup
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
          # 2) upload to S3 (credentials come from IRSA, no keys in the cluster)
          containers:
            - name: upload
              image: {{ .Values.backup.uploadImage | quote }}
              env:
                - name: AWS_REGION
                  value: {{ .Values.backup.region | quote }}
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.backup.region | quote }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  FILE=`cat /backup/filename`
                  aws s3 cp "/backup/$FILE" "s3://{{ .Values.backup.bucket }}/{{ .Values.backup.prefix }}/$FILE"
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
          {{- with .Values.backup.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backup.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
