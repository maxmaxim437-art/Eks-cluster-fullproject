server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:3000;   # Kubernetes Service name of the backend
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / { try_files $uri /index.html; }
}

# Internal status endpoint for the nginx-exporter sidecar (same Pod).
# Not exposed through the Service or the Ingress; only 127.0.0.1 may read it.
server {
  listen 8080;
  location /stub_status {
    stub_status;
    allow 127.0.0.1;
    deny all;
  }
}
