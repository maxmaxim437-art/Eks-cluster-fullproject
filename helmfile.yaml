# =====================================================================
# EKS Production Stack - one declarative file for the whole cluster
#   helmfile diff   -> preview
#   helmfile sync   -> install / upgrade everything in dependency order
#   helmfile -e staging sync -> same, with the staging overrides
# =====================================================================

environments:
  default:
    values:
      - environments/default.yaml
  staging:
    values:
      - environments/default.yaml
      - environments/staging.yaml

---
repositories:
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: external-secrets
    url: https://charts.external-secrets.io
  - name: external-dns
    url: https://kubernetes-sigs.github.io/external-dns/
  - name: fairwinds-stable
    url: https://charts.fairwinds.com/stable
  - name: metrics-server
    url: https://kubernetes-sigs.github.io/metrics-server/
  - name: eks
    url: https://aws.github.io/eks-charts
  - name: karpenter
    url: public.ecr.aws/karpenter
    oci: true

helmDefaults:
  wait: true
  timeout: 600
  createNamespace: true
  cleanupOnFail: true

releases:
  # ------------------------- platform / infra -------------------------
  - name: kube-prometheus-stack
    namespace: monitoring
    chart: prometheus-community/kube-prometheus-stack
    version: "93.3.0"
    values:
      - values/monitoring.yaml

  - name: external-secrets
    namespace: external-secrets
    chart: external-secrets/external-secrets
    version: "2.15.0"
    values:
      - values/external-secrets.yaml.gotmpl

  - name: external-dns
    namespace: external-dns
    chart: external-dns/external-dns
    version: "1.23.0"
    values:
      - values/external-dns.yaml.gotmpl

  # Creates the ALB for every Ingress with className "alb". The frontend waits for it.
  - name: aws-load-balancer-controller
    namespace: kube-system
    chart: eks/aws-load-balancer-controller
    version: "3.6.3"
    values:
      - values/aws-lb-controller.yaml.gotmpl

  - name: vpa
    namespace: vpa
    chart: fairwinds-stable/vpa
    version: "5.2.0"
    values:
      - values/vpa.yaml

  - name: karpenter
    namespace: karpenter
    chart: karpenter/karpenter
    version: "1.15.2"
    values:
      - values/karpenter.yaml.gotmpl

  # EKS usually ships metrics-server. Enable with metricsServer.enabled: true
  # in environments/default.yaml only if `kubectl top nodes` does not work.
  - name: metrics-server
    namespace: kube-system
    chart: metrics-server/metrics-server
    version: "3.14.0"
    condition: metricsServer.enabled
    values:
      - values/metrics-server.yaml

  # ---------------------------- application ----------------------------
  # database -> backend -> frontend.
  # The database also needs the ServiceMonitor / VPA CRDs and the secrets operator,
  # so those releases are listed in `needs` too.
  - name: database
    namespace: production
    chart: ./charts/database
    needs:
      - external-secrets/external-secrets
      - monitoring/kube-prometheus-stack
      - vpa/vpa
      - production/platform
    values:
      - values/database.yaml.gotmpl

  - name: backend
    namespace: production
    chart: ./charts/backend
    needs:
      - production/database
      - production/platform
    values:
      - values/backend.yaml.gotmpl

  - name: frontend
    namespace: production
    chart: ./charts/frontend
    needs:
      - production/backend
      - kube-system/aws-load-balancer-controller
    values:
      - values/frontend.yaml.gotmpl

  # ------------------------- cluster configuration -------------------------
  # ExternalSecrets (db-credentials, jwt-secret), Prometheus alerts, Karpenter NodePools.
  # Needs the CRDs created by the three operators below. The backend waits for it,
  # because the backend pods need the Secrets this release creates.
  - name: platform
    namespace: production
    chart: ./charts/platform
    needs:
      - external-secrets/external-secrets
      - monitoring/kube-prometheus-stack
      - karpenter/karpenter
    values:
      - values/platform.yaml.gotmpl
